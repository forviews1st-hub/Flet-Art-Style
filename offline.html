<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Cafe | Offline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 20% 20%, #fffdf8 0%, #fdf6ec 40%, #f5e6d3 100%);
      color: #2A1F14;
      -webkit-font-smoothing: antialiased;
    }
    .offline-card {
      max-width: 420px;
      width: 100%;
      background: radial-gradient(circle at 25% 15%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.6) 45%, transparent 70%),
                  linear-gradient(145deg, #ffffff 0%, #fdf6ec 40%, #f9efe2 100%);
      border: 2px solid #f0e0c9;
      border-radius: 32px;
      padding: 44px 32px 36px;
      text-align: center;
      position: relative;
      box-shadow: 0 30px 60px rgba(120, 90, 50, 0.25), 0 10px 20px rgba(120, 90, 50, 0.15),
                  inset 0 3px 4px rgba(255,255,255,1), inset 0 -6px 14px rgba(180, 150, 120, 0.2);
      overflow: hidden;
      animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.85) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .offline-card::after {
      content: '';
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      border: 2px dashed #d9b58a;
      border-radius: 24px;
      pointer-events: none;
      opacity: 0.5;
    }
    .offline-icon-wrap {
      width: 100px; height: 100px;
      margin: 0 auto 22px;
      background: linear-gradient(145deg, #ffffff 0%, #fdf6ec 45%, #ecdcc4 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(217, 181, 138, 0.6);
      box-shadow: 0 10px 24px rgba(120, 90, 50, 0.25),
                  inset 0 3px 6px rgba(255,255,255,1),
                  inset 0 -4px 10px rgba(180, 150, 120, 0.25);
      position: relative;
      z-index: 2;
      animation: pulseIcon 2s ease-in-out infinite;
    }
    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .offline-brand {
      font-family: 'Bluecherries', cursive, serif;
      font-size: 34px;
      letter-spacing: 1.5px;
      color: #1A1A1A;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .offline-title {
      font-size: 22px;
      font-weight: 800;
      color: #2A1F14;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
      position: relative;
      z-index: 2;
    }
    .offline-message {
      font-size: 14.5px;
      color: #5a4a3a;
      line-height: 1.75;
      margin-bottom: 28px;
      font-weight: 500;
      position: relative;
      z-index: 2;
    }
    .offline-message strong { color: #2A1F14; font-weight: 700; }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(145deg, #3d3226 0%, #1A1A1A 45%, #050505 100%);
      color: #fff;
      border: 1.5px solid #d9b58a;
      border-radius: 30px;
      padding: 15px 34px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.4px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      box-shadow: 0 12px 28px rgba(26, 26, 26, 0.45), 0 4px 10px rgba(217, 181, 138, 0.35),
                  inset 0 2px 4px rgba(255, 255, 255, 0.18), inset 0 -3px 7px rgba(0, 0, 0, 0.5);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      z-index: 2;
    }
    .retry-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 18px 36px rgba(26, 26, 26, 0.55), 0 6px 14px rgba(217, 181, 138, 0.45),
                  inset 0 2px 5px rgba(255, 255, 255, 0.22), inset 0 -3px 7px rgba(0, 0, 0, 0.55);
    }
    .retry-btn:active { transform: translateY(1px) scale(0.98); }
    .offline-footer {
      margin-top: 26px;
      font-size: 11.5px;
      color: #8a7a6a;
      font-weight: 600;
      letter-spacing: 0.3px;
      position: relative;
      z-index: 2;
    }
    .offline-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 26px 0 18px;
      position: relative;
      z-index: 2;
    }
    .offline-divider::before, .offline-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d9b58a, transparent);
      opacity: 0.6;
    }
    .offline-divider span { font-size: 16px; color: #b8956a; }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: #FF4D4D;
      border-radius: 50%;
      margin-right: 6px;
      animation: blink 1.5s ease-in-out infinite;
      vertical-align: middle;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon-wrap">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#b8956a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1.42 9a16 16 0 0 1 21.16 0" />
        <path d="M5 12.55a11 11 0 0 1 14.08 0" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
        <line x1="2" y1="2" x2="22" y2="22" stroke="#FF4D4D" stroke-width="2.2" />
      </svg>
    </div>
    <div class="offline-brand">Aura Cafe</div>
    <div class="offline-title"><span class="status-dot"></span>You're Offline</div>
    <div class="offline-message">
      It looks like you've lost your internet connection. Your <strong>taste buds</strong> will have to wait just a moment.<br><br>
      Reconnect and we'll get you back to your favourite treats.
    </div>
    <button class="retry-btn" onclick="window.location.href='/'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
      Try Again
    </button>
    <div class="offline-divider"><span>☕</span></div>
    <div class="offline-footer">© 2026 Aura Cafe • Good Food, Good Mood</div>
  </div>

  <script>
    window.addEventListener('online', function() {
      setTimeout(function() { window.location.href = '/'; }, 800);
    });
  </script>
</body>
</html>
